name: Maven version probe

on:
  push:
    paths:
      - .github/workflows/maven-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest Google Maven releases
        run: |
          base=https://dl.google.com/dl/android/maven2
          for a in \
            com/google/android/gms/play-services-mlkit-document-scanner \
            com/google/android/gms/play-services-code-scanner \
            com/google/android/gms/play-services-mlkit-barcode-scanning \
            com/google/android/gms/play-services-mlkit-text-recognition \
            com/google/android/gms/play-services-mlkit-text-recognition-devanagari \
            com/google/android/gms/play-services-mlkit-text-recognition-chinese \
            com/google/android/gms/play-services-mlkit-text-recognition-japanese \
            com/google/android/gms/play-services-mlkit-text-recognition-korean \
            com/google/android/gms/play-services-mlkit-subject-segmentation \
            com/google/android/gms/play-services-base \
            androidx/exifinterface/exifinterface; do
            meta=$(curl -fsSL "$base/$a/maven-metadata.xml" || echo "")
            all=$(echo "$meta" | grep -oE '<version>[^<]+</version>' | sed -E 's#</?version>##g' | sort -V | tail -3 | tr '\n' ' ')
            echo "$a => $all"
          done
