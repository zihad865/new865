name: Maven version probe

on:
  push:
    paths:
      - .github/workflows/maven-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest Google Maven releases
        run: |
          set -u
          base=https://dl.google.com/dl/android/maven2
          for a in \
            com/android/tools/build/gradle \
            androidx/compose/compose-bom \
            androidx/activity/activity-compose \
            androidx/navigation/navigation-compose \
            androidx/lifecycle/lifecycle-runtime-compose \
            androidx/lifecycle/lifecycle-viewmodel-compose \
            androidx/datastore/datastore-preferences \
            androidx/core/core-ktx \
            androidx/test/core \
            androidx/test/ext/junit \
            androidx/exifinterface/exifinterface; do
            meta=$(curl -fsSL "$base/$a/maven-metadata.xml")
            stable=$(echo "$meta" | grep -oE '<version>[0-9.]+</version>' | sed -E 's#</?version>##g' | sort -V | tail -1)
            echo "$a stable=$stable"
          done
          echo "Android SDK: $ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
