name: Anymaker Android

on:
  push:
    paths:
      - anymaker-android/**
      - .github/workflows/anymaker.yml
  pull_request:
    paths:
      - anymaker-android/**
  workflow_dispatch:

concurrency:
  group: anymaker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: anymaker-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and UI tests (Robolectric)
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Show lint errors
        if: failure()
        run: grep -h -A3 "Error:" app/build/reports/lint-results-debug.txt || true

      - name: Decode upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANYMAKER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANYMAKER_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key found: release will be signed."
          else
            echo "::warning::No ANYMAKER_KEYSTORE_BASE64 secret: release AAB is unsigned and cannot be uploaded to Play."
          fi

      - name: Release bundle and APK
        env:
          ANYMAKER_KEYSTORE_PASS: ${{ secrets.ANYMAKER_KEYSTORE_PASS }}
          ANYMAKER_KEY_ALIAS: ${{ secrets.ANYMAKER_KEY_ALIAS }}
        run: ./gradlew --stacktrace bundleRelease assembleRelease assembleDebug

      - name: Verify signatures
        if: env.ANYMAKER_KEYSTORE != ''
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      # Unsigned bundle and debug APK go to an orphan branch so they can be fetched with plain git
      # and signed offline with the upload key, without storing the key in GitHub.
      - name: Publish build outputs to the anymaker-builds branch
        if: github.event_name == 'push'
        run: |
          out="$RUNNER_TEMP/builds"
          mkdir -p "$out"
          cp app/build/outputs/bundle/release/app-release.aab "$out/anymaker-release-unsigned.aab"
          cp app/build/outputs/apk/debug/app-debug.apk "$out/anymaker-debug.apk"
          cp app/build/outputs/mapping/release/mapping.txt "$out/mapping.txt"
          echo "${GITHUB_SHA}" > "$out/SOURCE_COMMIT"
          cd "$out"
          git init -q -b anymaker-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Anymaker build of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" anymaker-builds

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            anymaker-android/app/build/reports/
            anymaker-android/app/build/test-results/

      - uses: actions/upload-artifact@v4
        with:
          name: anymaker-release
          path: |
            anymaker-android/app/build/outputs/bundle/release/*.aab
            anymaker-android/app/build/outputs/apk/release/*.apk
            anymaker-android/app/build/outputs/mapping/release/mapping.txt

      - uses: actions/upload-artifact@v4
        with:
          name: anymaker-debug-apk
          path: anymaker-android/app/build/outputs/apk/debug/*.apk
