name: Anymaker Android

on:
  push:
    paths:
      - anymaker-android/**
      - .github/workflows/anymaker.yml
  pull_request:
    paths:
      - anymaker-android/**
  workflow_dispatch:

concurrency:
  group: anymaker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: anymaker-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and UI tests (Robolectric)
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew --stacktrace lintDebug

      - name: Decode upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANYMAKER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANYMAKER_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Upload key found: release will be signed."
          else
            echo "::warning::No ANYMAKER_KEYSTORE_BASE64 secret: release AAB is unsigned and cannot be uploaded to Play."
          fi

      - name: Release bundle and APK
        env:
          ANYMAKER_KEYSTORE_PASS: ${{ secrets.ANYMAKER_KEYSTORE_PASS }}
          ANYMAKER_KEY_ALIAS: ${{ secrets.ANYMAKER_KEY_ALIAS }}
        run: ./gradlew --stacktrace bundleRelease assembleRelease assembleDebug

      - name: Verify signatures
        if: env.ANYMAKER_KEYSTORE != ''
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            anymaker-android/app/build/reports/
            anymaker-android/app/build/test-results/

      - uses: actions/upload-artifact@v4
        with:
          name: anymaker-release
          path: |
            anymaker-android/app/build/outputs/bundle/release/*.aab
            anymaker-android/app/build/outputs/apk/release/*.apk
            anymaker-android/app/build/outputs/mapping/release/mapping.txt

      - uses: actions/upload-artifact@v4
        with:
          name: anymaker-debug-apk
          path: anymaker-android/app/build/outputs/apk/debug/*.apk
